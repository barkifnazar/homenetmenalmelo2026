<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homenetmen Almelo Marzahantes 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --arm-red:    #D90012;
    --arm-blue:   #0033A0;
    --arm-orange: #F2A800;
    --surface:    #F4F5F8;
    --card:       #FFFFFF;
    --border:     rgba(0,0,0,0.08);
    --text:       #1A1A1A;
    --muted:      #6B6B6B;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--surface); color: var(--text); min-height: 100vh; }

  /* ── HEADER ─────────────────────────────────────────── */
  .arm-stripe {
    height: 7px;
    background: linear-gradient(90deg, var(--arm-red) 0% 33.3%, var(--arm-blue) 33.3% 66.6%, var(--arm-orange) 66.6% 100%);
  }
  header { background: #fff; border-bottom: 1px solid var(--border); }
  .header-inner { max-width: 1100px; margin: 0 auto; padding: 1.3rem 2rem; display: flex; align-items: center; gap: 1.2rem; }

  .logo-img { height: 64px; width: auto; flex-shrink: 0; object-fit: contain; }
  .logo-fallback { height: 64px; width: 64px; flex-shrink: 0; border-radius: 50%; background: var(--arm-blue); display: none; align-items: center; justify-content: center; font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; color: #fff; letter-spacing: 1px; }

  .header-text h1 { font-family: 'Bebas Neue', sans-serif; font-size: 1.95rem; letter-spacing: 1.5px; line-height: 1.1; color: var(--arm-blue); }
  .header-text h1 em { font-style: normal; color: var(--arm-red); }
  .header-text p { margin-top: 0.2rem; font-size: 0.76rem; color: var(--muted); letter-spacing: 0.07em; text-transform: uppercase; }

  /* ── TABS ────────────────────────────────────────────── */
  .tabs-bar { background: #fff; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
  .tabs-inner { max-width: 1100px; margin: 0 auto; padding: 0 2rem; display: flex; overflow-x: auto; scrollbar-width: none; border-bottom: 2px solid var(--border); }
  .tabs-inner::-webkit-scrollbar { display: none; }
  .tab-btn { font-family: 'DM Sans', sans-serif; font-size: 0.81rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); background: none; border: none; border-bottom: 3px solid transparent; padding: 0.9rem 1.2rem; cursor: pointer; white-space: nowrap; transition: color 0.2s, border-color 0.2s; margin-bottom: -2px; }
  .tab-btn:hover { color: var(--arm-blue); }
  .tab-btn.active { color: var(--arm-blue); border-bottom-color: var(--arm-red); }

  /* ── REFRESH BAR ─────────────────────────────────────── */
  .refresh-bar { max-width: 1100px; margin: 0 auto; padding: 0.5rem 2rem; display: flex; align-items: center; gap: 0.6rem; font-size: 0.75rem; color: var(--muted); }
  .refresh-btn { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 3px 10px; font-size: 0.73rem; cursor: pointer; color: var(--muted); transition: background 0.15s; }
  .refresh-btn:hover { background: #eee; }
  .refresh-dot { width: 7px; height: 7px; border-radius: 50%; background: #ccc; margin-left: auto; }
  .refresh-dot.live { background: #27ae60; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* ── MAIN ────────────────────────────────────────────── */
  main { max-width: 1100px; margin: 0 auto; padding: 1.5rem 2rem 2rem; }
  .category-panel { display: none; }
  .category-panel.active { display: block; }

  /* ── SECTION LABEL ───────────────────────────────────── */
  .section-label { font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; letter-spacing: 2px; color: var(--arm-blue); margin: 2rem 0 1rem; display: flex; align-items: center; gap: 0.7rem; }
  .section-label::before { content: ''; width: 4px; height: 1.1em; background: var(--arm-red); border-radius: 2px; flex-shrink: 0; }
  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* ── GRID ────────────────────────────────────────────── */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
  @media (max-width: 700px) {
    .grid-2 { grid-template-columns: 1fr; }
    .header-text h1 { font-size: 1.4rem; }
    main { padding: 1rem 0.75rem 2rem; }
  }

  /* ── CARD ────────────────────────────────────────────── */
  .card { background: var(--card); border-radius: 10px; border: 1px solid var(--border); overflow: hidden; }
  .card-head { background: var(--arm-blue); color: #fff; padding: 0.6rem 1rem; font-family: 'Bebas Neue', sans-serif; font-size: 1rem; letter-spacing: 1.2px; display: flex; align-items: center; gap: 0.5rem; }
  .card-head .badge { margin-left: auto; font-family: 'DM Sans', sans-serif; font-size: 0.67rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; background: var(--arm-orange); color: #5c3200; padding: 2px 8px; border-radius: 20px; }

  /* ── MATCHES ─────────────────────────────────────────── */
  .match-item { display: grid; grid-template-columns: 68px 1fr auto 1fr; align-items: center; padding: 0.7rem 1rem; gap: 0.5rem; border-bottom: 1px solid var(--border); transition: background 0.15s; }
  .match-item:last-child { border-bottom: none; }
  .match-item:hover { background: #eef1fb; }
  .match-meta { font-size: 0.7rem; color: var(--muted); line-height: 1.65; }
  .team-name { font-weight: 500; font-size: 0.86rem; line-height: 1.3; }
  .team-home { text-align: right; }
  .team-away { text-align: left; }

  .score-box { display: flex; align-items: center; justify-content: center; gap: 4px; min-width: 62px; }
  .score-num { background: var(--arm-blue); color: #fff; width: 26px; height: 26px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue', sans-serif; font-size: 1.05rem; }
  .score-dash { color: var(--muted); font-size: 0.7rem; }
  .score-box.pending .score-num { background: #e4e8f5; color: var(--muted); font-size: 0.62rem; font-family: 'DM Sans', sans-serif; font-weight: 600; }

  /* ── STANDINGS ───────────────────────────────────────── */
  .standings-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; width: 100%; }
  .standings-table { width: 100%; min-width: 340px; border-collapse: collapse; font-size: 0.84rem; }
  .standings-table thead tr { background: #eef1fb; }
  .standings-table th { padding: 0.5rem 0.6rem; text-align: center; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--arm-blue); border-bottom: 1px solid var(--border); white-space: nowrap; }
  .standings-table th:first-child, .standings-table th:nth-child(2) { text-align: left; }
  .standings-table td { padding: 0.62rem 0.6rem; text-align: center; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .standings-table tr:last-child td { border-bottom: none; }
  .standings-table td:nth-child(2) { text-align: left; font-weight: 500; }

  /* top-2 highlight */
  .finalist-row { background: rgba(0,51,160,0.04); }
  .finalist-row td:first-child { border-left: 3px solid var(--arm-orange); }

  .standing-pos { width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 0.72rem; font-weight: 700; }
  .pos-1 { background: var(--arm-orange); color: #5c3200; }
  .pos-2 { background: #B0B7BF; color: #fff; }
  .pos-3, .pos-4, .pos-5, .pos-6 { background: #eee; color: var(--muted); }
  .pts { font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; color: var(--arm-red); }

  /* top-2 promotion badge */
  .promo-note { font-size: 0.7rem; color: var(--muted); padding: 0.45rem 0.75rem; background: #fffbf0; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 0.4rem; }
  .promo-dot { width: 8px; height: 8px; border-radius: 2px; background: var(--arm-orange); flex-shrink: 0; }

  /* ── FINALES TAB ─────────────────────────────────────── */
  .finales-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.25rem; margin-top: 0.5rem; }
  .finale-card { background: var(--arm-blue); border-radius: 10px; padding: 1.4rem; text-align: center; color: #fff; position: relative; overflow: hidden; }
  .finale-card::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(-45deg, transparent, transparent 18px, rgba(255,255,255,0.03) 18px, rgba(255,255,255,0.03) 36px); }
  .finale-label { font-family: 'Bebas Neue', sans-serif; letter-spacing: 3px; font-size: 0.88rem; color: var(--arm-orange); margin-bottom: 1rem; position: relative; }
  .finale-teams { display: flex; align-items: center; justify-content: center; gap: 1rem; position: relative; }
  .finale-team { font-family: 'Bebas Neue', sans-serif; font-size: 1.35rem; letter-spacing: 1px; flex: 1; line-height: 1.2; }
  .finale-score { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
  .finale-num { background: rgba(255,255,255,0.15); color: #fff; width: 36px; height: 36px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; }
  .finale-info { margin-top: 0.8rem; font-size: 0.76rem; color: rgba(255,255,255,0.45); position: relative; }
  .winner-banner { display: flex; align-items: center; justify-content: center; gap: 0.7rem; background: var(--arm-orange); border-radius: 8px; padding: 0.75rem 1.2rem; margin-top: 1rem; font-weight: 700; font-size: 0.95rem; color: #5c3200; position: relative; }
  .pen-score { margin-top: 0.55rem; font-size: 0.78rem; color: rgba(255,255,255,0.55); position: relative; letter-spacing: 0.03em; }
  .pen-score strong { color: rgba(255,255,255,0.85); font-weight: 700; }

  /* ── LOADING ─────────────────────────────────────────── */
  .state-box { padding: 2.5rem; text-align: center; color: var(--muted); font-size: 0.9rem; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--arm-red); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 1rem; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── FOOTER ──────────────────────────────────────────── */
  footer { text-align: center; padding: 1.8rem; font-size: 0.75rem; color: var(--muted); border-top: 1px solid var(--border); margin-top: 3rem; }
  .footer-stripe { height: 4px; background: linear-gradient(90deg, var(--arm-red) 0% 33.3%, var(--arm-blue) 33.3% 66.6%, var(--arm-orange) 66.6% 100%); }
</style>
</head>
<body>

<div class="arm-stripe"></div>

<header>
  <div class="header-inner">
    <img
      class="logo-img"
      src="logo.png"
      alt="Ararat logo"
      onerror="this.style.display='none'; document.querySelector('.logo-fallback').style.display='flex';"
    />
    <div class="logo-fallback">ART</div>

    <div class="header-text">
      <h1>Homenetmen Almelo <em>Marzahantes 2026</em></h1>
      <p>Wedstrijden &amp; Resultaten</p>
    </div>
  </div>
</header>

<div class="tabs-bar">
  <div class="tabs-inner" id="tabs-inner"></div>
</div>

<div class="refresh-bar">
  <span id="refresh-status">Laden...</span>
  <button class="refresh-btn" onclick="loadAll()">↻ Vernieuwen</button>
  <div class="refresh-dot" id="refresh-dot"></div>
</div>

<main id="main-panels"></main>

<footer>Homenetmen Almelo Marzahantes 2026 &nbsp;·&nbsp; Alle rechten voorbehouden</footer>
<div class="footer-stripe"></div>

<script>
// ══════════════════════════════════════════════════════════════════════════════
// CONFIG — edit here only
// Columns needed per poule sheet: match, time, field, home, home_score, away_score, away
// Columns needed for finales sheet: round (or match), time, field, home, home_score, away_score, away, home_pen, away_pen
// To add or remove a poule: add/remove an object in POULES. That's it.
// ══════════════════════════════════════════════════════════════════════════════
const POULES = [
  { name: 'Poule A', url: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vREAo0W0qwPZvAq_RaP8PdlH2RMH721qKucn-PyxvhQRP-xtcU3bH3zuRdh_x9rRHenYqujK5omqg_j/pub?gid=1064256065&single=true&output=csv' },
   { name: 'Poule B', url: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vREAo0W0qwPZvAq_RaP8PdlH2RMH721qKucn-PyxvhQRP-xtcU3bH3zuRdh_x9rRHenYqujK5omqg_j/pub?gid=1695177292&single=true&output=csv' },
  // { name: 'Poule C', url: 'PASTE_CSV_URL_HERE' },
  // { name: 'Poule D', url: 'PASTE_CSV_URL_HERE' },
];
const FINALES_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vREAo0W0qwPZvAq_RaP8PdlH2RMH721qKucn-PyxvhQRP-xtcU3bH3zuRdh_x9rRHenYqujK5omqg_j/pub?gid=837176918&single=true&output=csv';
// ══════════════════════════════════════════════════════════════════════════════

// ── BUILD TABS & PANELS FROM CONFIG ──────────────────────────────────────────
(function buildShell() {
  const tabsEl = document.getElementById('tabs-inner');
  const mainEl = document.getElementById('main-panels');
  const loading = '<div class="state-box"><div class="spinner"></div>Gegevens laden...</div>';

  POULES.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
    btn.textContent = p.name;
    btn.onclick = () => showTab(i, btn);
    tabsEl.appendChild(btn);

    const panel = document.createElement('div');
    panel.id = 'tab-' + i;
    panel.className = 'category-panel' + (i === 0 ? ' active' : '');
    panel.innerHTML = loading;
    mainEl.appendChild(panel);
  });

  // Finales tab — always last
  const finIdx = POULES.length;
  const finBtn = document.createElement('button');
  finBtn.className = 'tab-btn';
  finBtn.textContent = 'Finales';
  finBtn.onclick = () => showTab(finIdx, finBtn);
  tabsEl.appendChild(finBtn);

  const finPanel = document.createElement('div');
  finPanel.id = 'tab-' + finIdx;
  finPanel.className = 'category-panel';
  finPanel.innerHTML = loading;
  mainEl.appendChild(finPanel);
})();

// ── TAB SWITCHING ─────────────────────────────────────────────────────────────
function showTab(idx, btn) {
  document.querySelectorAll('.category-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + idx).classList.add('active');
  btn.classList.add('active');
}

// ── CSV PARSER ────────────────────────────────────────────────────────────────
function parseCSV(text) {
  const lines = text.trim().split('\n').map(l => l.trim()).filter(Boolean);
  if (lines.length < 2) return [];
  const headers = lines[0].split(',').map(h => h.trim().toLowerCase().replace(/\r/g, ''));
  return lines.slice(1).map(line => {
    const vals = line.split(',').map(v => v.trim().replace(/\r/g, ''));
    const row = {};
    headers.forEach((h, i) => row[h] = vals[i] ?? '');
    return row;
  });
}

// ── STANDINGS CALCULATOR ──────────────────────────────────────────────────────
function calcStandings(matches) {
  const teams = {};
  const ensure = name => {
    if (!teams[name]) teams[name] = { name, p:0, w:0, d:0, l:0, gf:0, ga:0, pts:0 };
  };
  matches.forEach(m => {
    ensure(m.home); ensure(m.away);
    const hs = parseInt(m.home_score), as = parseInt(m.away_score);
    if (isNaN(hs) || isNaN(as)) return;
    teams[m.home].p++; teams[m.away].p++;
    teams[m.home].gf += hs; teams[m.home].ga += as;
    teams[m.away].gf += as; teams[m.away].ga += hs;
    if (hs > as)      { teams[m.home].w++; teams[m.home].pts += 3; teams[m.away].l++; }
    else if (hs < as) { teams[m.away].w++; teams[m.away].pts += 3; teams[m.home].l++; }
    else              { teams[m.home].d++; teams[m.home].pts++; teams[m.away].d++; teams[m.away].pts++; }
  });
  function h2hPts(teamNames) {
    const h2h = {};
    teamNames.forEach(n => h2h[n] = 0);
    matches.forEach(m => {
      if (!teamNames.includes(m.home) || !teamNames.includes(m.away)) return;
      const hs = parseInt(m.home_score), as = parseInt(m.away_score);
      if (isNaN(hs) || isNaN(as)) return;
      if (hs > as) h2h[m.home] += 3;
      else if (hs < as) h2h[m.away] += 3;
      else { h2h[m.home]++; h2h[m.away]++; }
    });
    return h2h;
  }
  const list = Object.values(teams);
  list.sort((a, b) => {
    if (b.pts !== a.pts) return b.pts - a.pts;
    const gdA = a.gf - a.ga, gdB = b.gf - b.ga;
    if (gdB !== gdA) return gdB - gdA;
    if (b.gf !== a.gf) return b.gf - a.gf;
    const tiedNames = list
      .filter(t => t.pts === a.pts && (t.gf - t.ga) === gdA && t.gf === a.gf)
      .map(t => t.name);
    const h2h = h2hPts(tiedNames);
    return h2h[b.name] - h2h[a.name];
  });
  return list;
}

// ── SCORE HTML ────────────────────────────────────────────────────────────────
function scoreHTML(hs, as, isFinale) {
  const played = hs !== '' && as !== '' && !isNaN(parseInt(hs));
  if (isFinale) {
    if (played) return `<div class="finale-score"><div class="finale-num">${hs}</div><span style="color:rgba(255,255,255,0.3);font-family:'Bebas Neue',sans-serif;font-size:1.1rem">–</span><div class="finale-num">${as}</div></div>`;
    return `<div style="color:rgba(255,255,255,0.3);font-size:0.9rem;padding:0 4px">vs</div>`;
  }
  if (played) return `<div class="score-box"><div class="score-num">${hs}</div><span class="score-dash">–</span><div class="score-num">${as}</div></div>`;
  return `<div class="score-box pending"><div class="score-num">–</div><span class="score-dash"></span><div class="score-num">–</div></div>`;
}

// ── POULE PANEL BUILDER ───────────────────────────────────────────────────────
function buildPoulePanel(matches, pouleName) {
  const matchRows = matches.map(m => `
    <div class="match-item">
      <div class="match-meta">${m.time || '–'}<br>Veld ${m.field || '–'}</div>
      <div class="team-name team-home">${m.home || ''}</div>
      ${scoreHTML(m.home_score, m.away_score, false)}
      <div class="team-name team-away">${m.away || ''}</div>
    </div>`).join('');

  const standings = calcStandings(matches);
  const standingRows = standings.map((t, i) => {
    const gd = t.gf - t.ga;
    return `<tr class="${i < 2 ? 'finalist-row' : ''}">
      <td><div class="standing-pos pos-${i+1}">${i+1}</div></td>
      <td>${t.name}</td>
      <td>${t.p}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td>
      <td>${gd > 0 ? '+'+gd : gd}</td>
      <td class="pts">${t.pts}</td>
    </tr>`;
  }).join('');

  return `
    <div class="section-label">Groepsfase — ${pouleName}</div>
    <div class="grid-2">
      <div class="card">
        <div class="card-head">Wedstrijden <span class="badge">${pouleName}</span></div>
        ${matchRows || '<div class="state-box">Geen wedstrijden gevonden</div>'}
      </div>
      <div class="card">
        <div class="card-head">Stand <span class="badge">${pouleName}</span></div>
        <div class="standings-wrapper">
          <table class="standings-table">
            <thead><tr><th>#</th><th>Team</th><th>G</th><th>W</th><th>G</th><th>V</th><th>+/-</th><th>Pnt</th></tr></thead>
            <tbody>${standingRows || '<tr><td colspan="8" style="text-align:center;padding:1rem;color:var(--muted)">Nog geen gespeelde wedstrijden</td></tr>'}</tbody>
          </table>
        </div>
        <div class="promo-note"><div class="promo-dot"></div> Top 2 gaat door naar de Finales</div>
      </div>
    </div>`;
}

// ── FINALES PANEL BUILDER ─────────────────────────────────────────────────────
function buildFinalesPanel(matches) {
  if (!matches.length) return '<div class="state-box">Geen finales gevonden in het spreadsheet.</div>';

  const cards = matches.map(m => {
    const fPlayed = m.home_score !== '' && !isNaN(parseInt(m.home_score));
    const home = m.home || 'PM', away = m.away || 'PM';
    const dimH = m.home ? '' : 'style="color:rgba(255,255,255,0.35)"';
    const dimA = m.away ? '' : 'style="color:rgba(255,255,255,0.35)"';

    let bottomHTML = `<div class="finale-info">Finalisten worden bepaald na de groepsfase</div>`;
    if (fPlayed) {
      const hs = parseInt(m.home_score), as = parseInt(m.away_score);
      const isDraw = hs === as;
      const hp = parseInt(m.home_pen), ap = parseInt(m.away_pen);
      const hasPen = isDraw && !isNaN(hp) && !isNaN(ap);
      let winner = null;
      if (!isDraw)      winner = hs > as ? home : away;
      else if (hasPen)  winner = hp > ap ? home : hp < ap ? away : null;
      const penLine = hasPen
        ? `<div class="pen-score">Strafschoppen: <strong>${hp} – ${ap}</strong></div>`
        : (isDraw && !hasPen ? `<div class="pen-score">Strafschoppen worden bijgewerkt...</div>` : '');
      bottomHTML = winner
        ? `<div class="winner-banner">🏆 Winnaar: ${winner}</div>${penLine}`
        : penLine || `<div class="finale-info">Gelijkspel</div>`;
    }

    const roundLabel = m.round || m.match || 'Finale';
    return `
      <div class="finale-card">
        <div class="finale-label">★ ${roundLabel} — Veld ${m.field || '–'} &nbsp;|&nbsp; ${m.time || '–'}</div>
        <div class="finale-teams">
          <div class="finale-team" ${dimH}>${home}</div>
          ${scoreHTML(m.home_score, m.away_score, true)}
          <div class="finale-team" ${dimA}>${away}</div>
        </div>
        ${bottomHTML}
      </div>`;
  }).join('');

  return `
    <div class="section-label">Finales</div>
    <div class="finales-grid">${cards}</div>`;
}

// ── DATA LOADING ──────────────────────────────────────────────────────────────
async function fetchCSV(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return parseCSV(await res.text());
}

async function loadPoule(idx, poule) {
  const tabId = 'tab-' + idx;
  if (!poule.url || poule.url.startsWith('PASTE_')) {
    document.getElementById(tabId).innerHTML = `<div class="state-box">⚙️ Voeg de CSV-URL in voor <strong>${poule.name}</strong>.</div>`;
    return;
  }
  try {
    const matches = await fetchCSV(poule.url);
    if (!matches.length) throw new Error('Geen rijen gevonden — controleer de kolomnamen');
    document.getElementById(tabId).innerHTML = buildPoulePanel(matches, poule.name);
  } catch (e) {
    document.getElementById(tabId).innerHTML = `<div class="state-box">❌ Laden mislukt voor <strong>${poule.name}</strong>.<br><small>${e.message}</small></div>`;
  }
}

async function loadFinales() {
  const tabId = 'tab-' + POULES.length;
  if (!FINALES_URL || FINALES_URL.startsWith('PASTE_')) {
    document.getElementById(tabId).innerHTML = `<div class="state-box">⚙️ Voeg de CSV-URL in voor de Finales.</div>`;
    return;
  }
  try {
    const matches = await fetchCSV(FINALES_URL);
    if (!matches.length) throw new Error('Geen rijen gevonden — controleer de kolomnamen');
    document.getElementById(tabId).innerHTML = buildFinalesPanel(matches);
  } catch (e) {
    document.getElementById(tabId).innerHTML = `<div class="state-box">❌ Laden mislukt voor <strong>Finales</strong>.<br><small>${e.message}</small></div>`;
  }
}

async function loadAll() {
  document.getElementById('refresh-dot').classList.remove('live');
  document.getElementById('refresh-status').textContent = 'Laden...';
  await Promise.all([
    ...POULES.map((p, i) => loadPoule(i, p)),
    loadFinales()
  ]);
  const now = new Date().toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
  document.getElementById('refresh-status').textContent = `Bijgewerkt om ${now}`;
  document.getElementById('refresh-dot').classList.add('live');
}

loadAll();
setInterval(loadAll, 90000);
</script>
